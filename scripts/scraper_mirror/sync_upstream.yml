# =====================================================================
# Sync Upstream Code — private mirror of Nepse-All-Scraper
# =====================================================================
# Keeps the SCRAPER CODE in sync from the third-party upstream repo so we
# keep their fixes without depending on them staying online.
#
# IMPORTANT: this workflow intentionally syncs CODE paths only
# (scraper/, requirements.txt, README.md, .gitignore, and the
# daily_scraper.yml workflow). It never touches data/ (generated by OUR
# daily scrape) or docs/ (regenerated by our own build_api.py), and it
# syncs .github/ per-file so mirror-only workflows (sync_upstream.yml,
# health_check.yml) survive upstream updates — otherwise the two repos
# would fight over the same generated files every weekday.
# =====================================================================

name: Sync Upstream Code

on:
  schedule:
    # 13:30 UTC weekdays — 45 minutes after upstream's own 12:45 UTC run,
    # before the next trading day. Adjust freely.
    - cron: "30 13 * * 1-5"
  workflow_dispatch: # allow manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/SamirWagle/Nepse-All-Scraper.git 2>/dev/null || true
          git fetch upstream main

      - name: Pull scraper code from upstream (keep our data + our workflows)
        run: |
          # Bring in the latest code paths from upstream's main.
          #
          # Scoping is deliberate:
          #   * .github/ is synced as one specific file (daily_scraper.yml),
          #     NOT the whole directory — `git checkout upstream/main -- .github/`
          #     would DELETE mirror-only workflows (sync_upstream.yml,
          #     health_check.yml) that upstream does not have.
          #   * docs/ is not synced at all — build_api.py regenerates all of
          #     docs/ (including docs/api/**) during our own daily scrape, and
          #     pulling upstream's docs/ would clobber our generated data.
          git checkout upstream/main -- scraper/ requirements.txt README.md .gitignore
          git checkout upstream/main -- .github/workflows/daily_scraper.yml
          if git diff --cached --quiet; then
            echo "No upstream code changes to sync."
          else
            git commit -m "chore: sync scraper code from upstream $(date -u +%Y-%m-%d)"
            # Rebase onto latest main in case the daily scraper pushed while we ran.
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Synced upstream code to this mirror."
          fi

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Upstream sync failed. Check the log; if a code path conflicts,"
          echo "resolve manually and re-run via Actions -> Sync Upstream Code -> Run workflow."
