[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = src
# Sprint 13.8 — project-local basetemp is applied from tests/conftest.py
# (pytest_configure sets config.option.basetemp; it is not an ini key).
# Rationale: the default machine temp root (``pytest-of-<user>``)
# accumulates a broken ``pytest-current`` junction on Windows and pytest's
# dead-symlink cleanup raises PermissionError at session end, turning a
# green run into exit code 1.  A repo-local basetemp sidesteps that,
# keeps test state inside the checkout, and is wiped at session start.
